[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-wam"
version = "0.1.0"
description = "Compute-scaled pi0.7-style World-Action Model / VLA in a 2D grayscale game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "numpy",
    "pyyaml",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
human = ["pygame"]
web = ["fastapi", "uvicorn[standard]"]
dev = ["pytest"]

[tool.setuptools]
packages = ["game", "data", "models", "training", "evaluation", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
