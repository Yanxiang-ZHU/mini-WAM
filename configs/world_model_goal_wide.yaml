# World Model — goal-state subgoal, object-weighted, trained on the WIDE
# distribution (1-6 distractors, 1-3 obstacles) to cover dense-distractor and
# multi-obstacle scenes.
seed: 42
device: cuda

image:
  width: 48
  height: 48
  channels: 1

history:
  frames: 4

model:
  hidden_dim: 256
  layers: 6
  heads: 8
  patch: 8
  lang_layers: 2
  lang_heads: 4
  denoise_steps: 4
  obj_weight: 20

training:
  data: data/train_wide
  val_data: data/val
  batch_size: 128
  epochs: 12
  learning_rate: 0.0002
  weight_decay: 0.0
  workers: 4
  deltas: [8, 16, 24, 32]
  goal: true
  max_episodes: null
  save_every: 1
  mixed_precision: true

checkpoint:
  dir: checkpoints
  name: world_model_goal_wide
